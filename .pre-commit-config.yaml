repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # The pinned reconcile journal fixtures are byte-for-byte copies of what a pre-v2
        # release wrote, and that release wrote no trailing newline. Appending one would make
        # the compatibility tests run against bytes no version ever produced.
        exclude: '^tests/fixtures/reconcile-journal-v1-.*\.json$'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: no-commit-to-branch
        args: ['--branch', 'main']
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']
      - id: ruff-format

  - repo: local
    hooks:
      - id: type-check
        name: type check
        entry: uv run --locked --group dev ty check
        language: system
        types: [python]
      - id: check-typing-boundaries
        name: check typing boundaries
        entry: uv run --locked --group dev python scripts/check_typing_boundaries.py src/
        language: system
        types: [python]
        pass_filenames: false
      - id: check-version-sync
        name: check version sync
        entry: uv run --locked --group dev python scripts/check_version_sync.py
        language: system
        always_run: true
        pass_filenames: false
      # always_run rather than types: [markdown], because the break this catches is
      # cross-document: renaming a heading in one file invalidates a link written in another,
      # and the file that changed is not the file that ends up wrong.
      - id: doc-lattice-links
        name: doc-lattice links
        entry: uv run --locked --group dev doc-lattice links
        language: system
        always_run: true
        pass_filenames: false
      # always_run for the same reason, one file further apart: an edit to scaffold.py or to
      # MANAGED_CI.md invalidates a rule about CHANGELOG.md, and none of the three is the file
      # the other two changed. This mirrors the offline half only; the `Code quality` context is
      # the authority, and the script's docstring records why.
      - id: check-migration-rule
        name: check migration rule
        entry: uv run --locked --group dev python scripts/check_migration_rule.py
        language: system
        always_run: true
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
