name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check src/ tests/
      - run: uv run --no-sync ruff format --check src/ tests/
      - run: uv run --no-sync ty check src/
      - run: uv run --no-sync python scripts/check_typing_boundaries.py src/
      - run: uv run --no-sync python scripts/check_version_sync.py

  # --- semgrep start ---
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.61.0@sha256:22ea61d0e1f87dbcd8718b3d9003a4919268b0c3d004bb361c2d30e12e97a354
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: semgrep scan --error --config=p/python --config=p/security-audit --config=p/secrets
  # --- semgrep end ---

  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest

  guard-debt:
    name: Guard debt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The base tree is not present otherwise: a pull_request run checks out the merge ref
          # and the pinned action fetches one commit by default.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - name: Resolve the protected base revision
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$PR_BASE_SHA" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          # A branch's first push reports an all-zero predecessor and has no base to compare to.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "resolved=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A base whose object is missing is not a base that predates the gate: a force-push or a
          # re-created branch can leave `github.event.before` unreachable, and skipping there would
          # wave grown debt through with a green job. Only a readable base may reach the path probe
          # below, whose failure is the one condition that legitimately skips.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base $base is not readable in this clone; refusing to skip the comparison" >&2
            exit 1
          fi
          # The commit that introduces this gate, and the first push to main after it merges,
          # both have a base that carries neither the checker nor the debt snapshot. There is no
          # earlier debt to compare against, so skip rather than fail. The tree-local closure
          # check in the test suite still runs on every event.
          if ! git cat-file -e "$base:scripts/check_guard_inventory.py" 2>/dev/null \
            || ! git cat-file -e "$base:tests/fixtures/shell_guard_debt.json" 2>/dev/null \
            || ! git cat-file -e "$base:tests/guard_witnesses.py" 2>/dev/null; then
            echo "base $base predates the guard inventory gate; skipping the comparison"
            echo "resolved=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "resolved=$base" >> "$GITHUB_OUTPUT"
      - name: Extract the base-owned checker and debt snapshot
        if: steps.base.outputs.resolved != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.resolved }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          git show "$BASE_SHA:scripts/check_guard_inventory.py" \
            > "$RUNNER_TEMP/base/check_guard_inventory.py"
          git show "$BASE_SHA:tests/fixtures/shell_guard_debt.json" \
            > "$RUNNER_TEMP/base/shell_guard_debt.json"
          # The base's classified inventory, so a guard withdrawn together with its witness row is
          # visible to the comparison rather than leaving an intact partition behind.
          git show "$BASE_SHA:tests/guard_witnesses.py" \
            > "$RUNNER_TEMP/base/guard_witnesses.py"
      - name: Reject fail-closed guard debt the base did not already carry
        if: steps.base.outputs.resolved != ''
        # The checker is the base revision's copy and the candidate tree is only its input, so a
        # head change cannot weaken the extractor while making debt appear to shrink.
        run: |
          set -euo pipefail
          uv run --python 3.13 --no-project python \
            "$RUNNER_TEMP/base/check_guard_inventory.py" \
            --root . \
            --compare-base "$RUNNER_TEMP/base/shell_guard_debt.json" \
            --base-registry "$RUNNER_TEMP/base/guard_witnesses.py"

  corpus-differential:
    name: Corpus differential
    runs-on: ubuntu-latest
    # The gate replays one corpus against the candidate and against the revision it is proposed on
    # top of, and only a pull request payload names that pair. It deliberately stays out of the
    # `release` job's `needs`: a job skipped for push events skips every dependent with it.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The base tree is not present otherwise: a pull_request run checks out the merge ref
          # and the pinned action fetches one commit by default.
          fetch-depth: 0
      - name: Decide whether the differential has anything to compare
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Every input the replay reads, so a change to the tool or to the frozen corpus is in
          # scope exactly as a change to the guard package is, and an unrelated pull request pays
          # for a checkout and one diff rather than for twenty thousand scans. Bound here rather
          # than spelled in the run body because the guard package's own path carries the
          # distribution marker, which AD-17 refuses in an uncertified command.
          REPLAYED_PATHS: >-
            src/doc_lattice/github_ci/
            scripts/corpus_differential.py
            scripts/fuzz_shell_taint.py
            tests/fixtures/github_ci_checkpoint/replay_inventory.json
        run: |
          set -euo pipefail
          # A base whose object is missing is not a base that predates the gate: a force-push or a
          # re-created branch can leave it unreachable, and skipping there would wave a scanner
          # change through with a green job and nothing replayed.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "base is not readable in this clone; refusing to skip the differential" >&2
            exit 1
          fi
          # Split deliberately: the binding above is a path list, not one path.
          # shellcheck disable=SC2086
          changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- $REPLAYED_PATHS)"
          if [ -z "$changed" ]; then
            echo "no replayed input changed; the differential has nothing to compare"
            echo "in-scope=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "replaying because these inputs changed:"
          echo "$changed"
          echo "in-scope=true" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.scope.outputs.in-scope == 'true'
        with:
          enable-cache: true
      - name: Install a pinned interpreter and the locked environment
        if: steps.scope.outputs.in-scope == 'true'
        run: |
          set -euo pipefail
          uv python install 3.13
          uv sync --locked --group dev
      - name: Materialize the protected base revision
        if: steps.scope.outputs.in-scope == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
      - name: Replay the corpus against the protected base
        if: steps.scope.outputs.in-scope == 'true'
        # The tool and the corpus are the candidate's in both runs, so the two records score the
        # same scripts and the guard package is the only thing that differs between them.
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/corpus_differential.py record \
            --scanner-root "$RUNNER_TEMP/base" \
            --out "$RUNNER_TEMP/base-verdicts.json"
      - name: Replay the corpus against the candidate
        if: steps.scope.outputs.in-scope == 'true'
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/corpus_differential.py record \
            --scanner-root . \
            --out "$RUNNER_TEMP/candidate-verdicts.json"
      - name: Report verdict divergence the pull request has not acknowledged
        if: steps.scope.outputs.in-scope == 'true'
        # The base's own copy of the frozen inventory is the corpus floor: without it a candidate
        # could shrink the corpus until the divergence it introduces has nothing left to report.
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/corpus_differential.py compare \
            --base "$RUNNER_TEMP/base-verdicts.json" \
            --candidate "$RUNNER_TEMP/candidate-verdicts.json" \
            --base-inventory "$RUNNER_TEMP/base/tests/fixtures/github_ci_checkpoint/replay_inventory.json" \
            --acknowledged tests/fixtures/corpus_differential_acknowledgements.json

  release:
    name: Release
    needs: [code-quality, tests, security-scan, guard-debt]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      create_tag: ${{ steps.gate.outputs.create_tag }}
      version: ${{ steps.target.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --group dev

      - name: Determine target tag
        id: target
        run: uv run --no-sync python scripts/release_target.py

      - name: Tag-health gate
        id: gate
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          git fetch --tags --force
          uv run --no-sync python scripts/release_gate.py

      - name: Re-assert version sync
        if: steps.gate.outputs.proceed == 'true'
        run: uv run --no-sync python scripts/check_version_sync.py

      - name: Smoke-test the commit
        if: steps.gate.outputs.proceed == 'true'
        env:
          REF: git+https://github.com/Guardantix/doc-lattice@${{ github.sha }}
          FIXTURE: tests/fixtures/release-smoke/.doc-lattice.yml
        run: |
          uvx --python 3.13 --from "${REF}" doc-lattice check --config "${FIXTURE}"
          uvx --python 3.13 --from "${REF}" doc-lattice lint --config "${FIXTURE}"
          workdir="$(mktemp -d)"
          ( cd "${workdir}" && uvx --python 3.13 --from "${REF}" doc-lattice init )

      - name: Create and push the tag
        if: steps.gate.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "${TAG}"

      - name: Publish release notes
        if: steps.gate.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; leaving it unchanged."
          else
            uv run --no-sync python scripts/extract_release_notes.py "${VERSION}" > release-notes.md
            gh release create "${TAG}" --title "${TAG}" --notes-file release-notes.md --verify-tag
          fi

      - name: Confirm pinned ref resolves
        if: steps.gate.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          uvx --python 3.13 --from "git+https://github.com/Guardantix/doc-lattice@${TAG}" doc-lattice --version

  build-release:
    name: Build release distributions
    needs: release
    if: needs.release.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Build distributions
        run: uv build
      - name: Validate distributions
        run: uvx --from twine twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [release, build-release]
    if: needs.release.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          skip-existing: true
