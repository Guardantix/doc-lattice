name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check src/ tests/ scripts/
      - run: uv run --no-sync ruff format --check src/ tests/ scripts/
      - run: uv run --no-sync ty check src/ scripts/
      - run: uv run --no-sync python scripts/check_typing_boundaries.py src/
      - run: uv run --no-sync python scripts/check_version_sync.py
      # One leg only. Every other step here is worth repeating per interpreter, but `links`
      # reads Markdown and resolves headings against the engine's inventory, so its verdict does
      # not depend on which interpreter ran it -- and under `--format github` a second run does
      # not merely repeat a log line, it annotates the same diff position twice. The command is
      # still exercised on both interpreters by the suite, which invokes it against this
      # repository on every `tests` leg (`test_the_repository_is_clean_through_the_real_command`).
      #
      # Spelled as an exclusion of the older leg, mirroring the coverage gate in `tests`, because
      # the two spellings fail in opposite directions when the matrix changes: naming the leg to
      # run on would silently drop the gate entirely if that value were ever removed, while
      # excluding one leg can at worst restore the duplication. `tests/test_link_gate_wiring.py`
      # pins the wiring, so neither can land unseen.
      - if: matrix.python != '3.13'
        run: uv run --no-sync doc-lattice links --format github
      # On a pull request the guard also compares the committed baseline against the base branch,
      # which is the half that catches a renderer and its baseline updated in the same commit. The
      # base ref is fetched shallowly because `actions/checkout` leaves only the merge commit.
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "${BASE_REF}" ]; then
            git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}"
            uv run --no-sync python scripts/check_migration_rule.py --base-ref FETCH_HEAD
          else
            uv run --no-sync python scripts/check_migration_rule.py
          fi

  # The three `*-result` jobs below exist so branch protection can require one fixed context per
  # matrix instead of the per-leg names GitHub generates from the matrix values. Requiring the
  # legs themselves put every matrix value into the branch rule as well, which meant a matrix
  # change here and a protection edit had to land together or strand every open pull request.
  #
  # Each is deliberately trivial -- no checkout, no network -- and fails closed. `always()` is
  # what makes that work: without it a failed matrix would *skip* the aggregator, and GitHub does
  # not treat a skipped check as failing, so the pull request would go green on a red matrix. The
  # success comparison therefore has to live in the step, never in the job-level `if:`, where it
  # would skip the job and restore exactly that bypass. `always()` also resists cancellation,
  # which here is the wanted behavior: a cancelled matrix must not merge either.
  #
  # `tests/test_release_workflow.py` pins this shape; RELEASING.md records the required list.
  code-quality-result:
    name: Code quality
    needs: code-quality
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix leg to have succeeded
        env:
          RESULT: ${{ needs.code-quality.result }}
        run: |
          echo "code-quality matrix reported: ${RESULT}"
          test "${RESULT}" = success

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.61.0@sha256:22ea61d0e1f87dbcd8718b3d9003a4919268b0c3d004bb361c2d30e12e97a354
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --error --config=p/python --config=p/security-audit --config=p/secrets

  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
      # The coverage gate runs once, on 3.14, where coverage.py measures branch coverage through
      # the sys.monitoring core. CPython gained the branch events that core needs in 3.14; under
      # 3.13 the same configuration falls back to the C tracer, which roughly doubles the suite's
      # runtime to re-measure a number the other leg already enforces. pytest reads this variable
      # itself, so the run body below stays free of workflow expressions.
      #
      # Every pytest job here also runs the suite across worker processes, for the reason this
      # comment records once and the two jobs below refer back to. The suite's cost is flat --
      # roughly 3100 tests at about 19ms each, with no test above three seconds -- so there is no
      # hot path to shorten and process parallelism is the only lever. `auto` resolves to the four
      # vCPUs an `ubuntu-latest` runner reports, which the run log confirms as "4/4 workers".
      #
      # Measured on the runner rather than on a developer machine, because the two disagree. The
      # yaml-compatibility pytest step went from about 76s to about 41s and the whole leg from
      # about 88s to about 50s, which is roughly 1.9x, not the near-4x the worker count suggests.
      # Those four vCPUs behave like two physical cores with SMT, and a CPU-bound Python suite
      # gains little from the second thread; a workstation with four real cores sees closer to
      # 3.3x on the same flags. Do not size this from a local measurement. Whether a larger runner
      # would recover the rest is untested, so nothing here assumes it either way.
      #
      # `--dist loadfile` is required, not a tuning choice. The default `load` distributes single
      # tests, which splits `tests/test_reconcile_fuzz.py` across workers and breaks the corpus
      # floor at the end of it: that test asserts over a module-level accumulator the other 2196
      # tests in the file populate, so a worker holding a subset sees claims that fired nowhere
      # and fails. `loadfile` keeps a file whole on one worker, which restores the session state
      # that test is documented to depend on. Anything that redistributes below file granularity
      # has to leave that file intact.
      PYTEST_ADDOPTS: >-
        -n auto --dist loadfile
        ${{ matrix.python == '3.13' && '--no-cov' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest

  tests-result:
    name: Tests
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix leg to have succeeded
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          echo "tests matrix reported: ${RESULT}"
          test "${RESULT}" = success

  yaml-compatibility:
    name: YAML parser compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The ends of the `ruamel.yaml` range AD-26 bounds the parser-internals surface to, as
        # version specifiers rather than as series. The floor is pinned to the exact version
        # `pyproject.toml` declares, since a `0.18.*` leg would resolve to the newest 0.18
        # release and leave every earlier permitted one untested. The ceiling stays a series so
        # it tracks whatever the range currently admits. The lock only ever installs the
        # ceiling, so without this leg a difference at the floor would ship unseen.
        ruamel: ['0.18.0', '0.19.*']
        # Both answers to "is the optional accelerator installed". Since AD-33 these legs assert
        # the same verdict rather than two, and running both is what proves it: the strict
        # frontmatter load pins the pure parser, so a regression that let the environment pick
        # the parser again would show up as the two legs disagreeing. `config.py` is still
        # declared as taking ruamel's default, so it is the one boundary where the C parser
        # actually runs here. The pure Python resolver caching that differs between the two
        # ruamel ends is what the floor leg has to expose.
        clib: [true, false]
    env:
      # The `tests` job owns the coverage gate; this leg only asks whether the suite still
      # passes against a different parser build. It carries the same worker settings, and the
      # `tests` job records why `--dist loadfile` is load-bearing rather than tuning.
      PYTEST_ADDOPTS: --no-cov -n auto --dist loadfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --group dev
      - run: uv pip install 'ruamel.yaml==${{ matrix.ruamel }}'
      # `ruamel.yaml.clib` is an optional accelerator no lock of this project installs, but any
      # other package in a user's environment may. Where a loader does not state its parser it
      # replaces the pure Python one with a C parser that reports different source marks and
      # skips resolver and directive state entirely. `frontmatter_parser` and `reconcile` state
      # theirs, so the suite runs both with and without it to prove their behavior does not move;
      # `config.py` does not, so this is where its remaining environment dependence is exercised.
      - if: matrix.clib
        run: uv pip install ruamel.yaml.clib
      - run: uv run --no-sync pytest

  yaml-compatibility-result:
    name: YAML parser compatibility
    needs: yaml-compatibility
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix leg to have succeeded
        env:
          RESULT: ${{ needs.yaml-compatibility.result }}
        run: |
          echo "yaml-compatibility matrix reported: ${RESULT}"
          test "${RESULT}" = success

  runtime-floor:
    name: Runtime floor compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Every runtime dependency AD-27 declares by floor and this engine reads rather than
        # merely calls, at the exact version `pyproject.toml` declares. Exact rather than a
        # `2.12.*` series, for the reason the ruamel leg pins its own: a series resolves to the
        # newest release in it and leaves every earlier permitted one untested. The lock only
        # ever installs the ceiling, so without these cells the whole span beneath each floor is
        # an asserted claim. `tests/test_release_workflow.py` derives this list from
        # `pyproject.toml` and fails when the two stop agreeing -- the correlation has to be
        # checked from a repository-only test, since the module that pins the floors themselves
        # ships in the sdist and cannot read this file.
        floor:
          - 'pydantic==2.12.0'
          - 'rich==13.8.0'
          - 'typer==0.26.0'
        # Both supported interpreters, crossed with each floor rather than sampled. `pydantic`
        # resolves through interpreter-specific `pydantic-core` wheels, so one interpreter's
        # answer is not the other's; 2.12.0 is the floor precisely because it is the earliest
        # release with a 3.14 wheel. Each cell holds exactly one dependency at its minimum and
        # takes the rest from the lock, because a constrained resolver may do the same and a
        # cell holding all three at once would not distinguish which one broke.
        python: ['3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
      # The `tests` job owns the coverage gate; these legs only ask whether the suite still
      # passes against the oldest version of one dependency the project declares. They carry the
      # same worker settings, and the `tests` job records why `--dist loadfile` is load-bearing
      # rather than tuning.
      PYTEST_ADDOPTS: --no-cov -n auto --dist loadfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv pip install '${{ matrix.floor }}'
      - run: uv run --no-sync pytest

  runtime-floor-result:
    name: Runtime floor compatibility
    needs: runtime-floor
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix leg to have succeeded
        env:
          RESULT: ${{ needs.runtime-floor.result }}
        run: |
          echo "runtime-floor matrix reported: ${RESULT}"
          test "${RESULT}" = success

  release:
    name: Release
    needs: [code-quality, tests, security-scan, yaml-compatibility, runtime-floor]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      create_tag: ${{ steps.gate.outputs.create_tag }}
      version: ${{ steps.target.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --group dev

      - name: Determine target tag
        id: target
        run: uv run --no-sync python scripts/release_target.py

      - name: Tag-health gate
        id: gate
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          git fetch --tags --force
          uv run --no-sync python scripts/release_gate.py

      - name: Re-assert version sync
        if: steps.gate.outputs.proceed == 'true'
        run: uv run --no-sync python scripts/check_version_sync.py

      # Generating the notes is separated from publishing them so the changelog is validated
      # while the run can still be abandoned cleanly. The extractor exits non-zero on a missing
      # or empty section, and a tag is immutable, so this has to precede the tag push; it also
      # precedes the network smoke below because it is the cheaper of the two failures to reach.
      - name: Extract release notes
        if: steps.gate.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          uv run --no-sync python scripts/extract_release_notes.py "${VERSION}" > release-notes.md

      - name: Smoke-test the commit
        if: steps.gate.outputs.proceed == 'true'
        env:
          REF: git+https://github.com/Guardantix/doc-lattice@${{ github.sha }}
          FIXTURE: tests/fixtures/release-smoke/.doc-lattice.yml
        run: |
          uvx --python 3.13 --from "${REF}" doc-lattice check --config "${FIXTURE}"
          uvx --python 3.13 --from "${REF}" doc-lattice lint --config "${FIXTURE}"
          workdir="$(mktemp -d)"
          ( cd "${workdir}" && uvx --python 3.13 --from "${REF}" doc-lattice init --print-only )
          test ! -e "${workdir}/.doc-lattice.yml"
          ( cd "${workdir}" && uvx --python 3.13 --from "${REF}" doc-lattice init )
          test -e "${workdir}/.doc-lattice.yml"

      - name: Create and push the tag
        if: steps.gate.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "${TAG}"

      - name: Publish release notes
        if: steps.gate.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; leaving it unchanged."
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file release-notes.md --verify-tag
          fi

      - name: Confirm pinned ref resolves
        if: steps.gate.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          uvx --python 3.13 --from "git+https://github.com/Guardantix/doc-lattice@${TAG}" doc-lattice --version

  build-release:
    name: Build release distributions
    needs: release
    if: needs.release.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build distributions
        run: uv build
      - name: Validate distributions
        run: uvx --from twine twine check dist/*
      # GTX-239: the only run of the built distribution that happens while publication can still
      # be stopped. The `release` job's pre-tag smoke installs from the Git source and omits
      # `--default-branch`, and Twine validation reads metadata without executing anything, so
      # without this step nothing exercises MANAGED_CI.md step 1's command shape against what
      # adopters actually install. It sits between validation and the upload on purpose: `publish`
      # consumes the artifact the next step produces, so a failure here leaves that artifact
      # unbuilt and there is nothing to publish. It cannot move into `publish`, which GitHub holds
      # for environment approval before any of its steps start -- a smoke there would run after
      # the decision it exists to inform, inside the job that holds the OIDC token.
      - name: Smoke-test the built distribution
        env:
          # Nothing ambient may satisfy this run. An installed `uv tool` copy of doc-lattice is
          # reachable from the default tool directory, and a green smoke drawn from one would say
          # nothing about the wheel this job built; pointing the lookup at a path this run owns
          # makes the provenance observable rather than inferred.
          UV_TOOL_DIR: ${{ runner.temp }}/release-smoke-tools
        run: |
          # The provider, resolved absolute before anything changes directory: the invocation
          # below runs from a throwaway directory, where a relative `dist/` names nothing. The
          # probe is also the sole-wheel gate -- a second wheel makes this two lines, which is
          # not a file -- so the run can only ever be the one distribution this job built.
          WHEEL="$(ls -1 "${GITHUB_WORKSPACE}"/dist/*.whl)"
          test -f "${WHEEL}"
          out="$(mktemp)"
          err="$(mktemp)"
          # `init` is the whole subject of the step, so its output is the evidence; capturing it
          # to files would otherwise hide it from a failed release run.
          trap 'cat "${err}" >&2; cat "${out}"' EXIT
          workdir="$(mktemp -d)"
          test ! -e "${workdir}/.doc-lattice.yml"
          ( cd "${workdir}" && uvx --python 3.13 --from "${WHEEL}" doc-lattice init --default-branch main ) >"${out}" 2>"${err}"
          test -e "${workdir}/.doc-lattice.yml"
          # The branch readback is printed after the write path and after the benign
          # already-exists path alike, so the config probe above is what proves scaffolding
          # happened. The two channels are kept apart because stdout owns the copy-paste blocks
          # and the readback is deliberately not among them.
          grep -qxF 'workflow triggers on branch main (--default-branch)' "${err}"
          # Spelled as a conditional rather than `! grep`, which errexit ignores by rule: a
          # negated pipeline is exempt, so the readback could reach stdout without failing here.
          if grep -qF 'workflow triggers on branch' "${out}"; then
            echo 'the branch readback reached stdout; step 1 of MANAGED_CI.md reads it off stderr' >&2
            exit 1
          fi
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [release, build-release]
    if: needs.release.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          skip-existing: true
