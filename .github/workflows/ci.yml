name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check src/ tests/
      - run: uv run --no-sync ruff format --check src/ tests/
      - run: uv run --no-sync ty check src/
      - run: uv run --no-sync python scripts/check_typing_boundaries.py src/
      - run: uv run --no-sync python scripts/check_version_sync.py

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.61.0@sha256:22ea61d0e1f87dbcd8718b3d9003a4919268b0c3d004bb361c2d30e12e97a354
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: semgrep scan --error --config=p/python --config=p/security-audit --config=p/secrets

  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
      # The coverage gate runs once, on 3.14, where coverage.py measures branch coverage through
      # the sys.monitoring core. CPython gained the branch events that core needs in 3.14; under
      # 3.13 the same configuration falls back to the C tracer, which roughly doubles the suite's
      # runtime to re-measure a number the other leg already enforces. pytest reads this variable
      # itself, so the run body below stays free of workflow expressions.
      PYTEST_ADDOPTS: ${{ matrix.python == '3.13' && '--no-cov' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest

  yaml-compatibility:
    name: YAML parser compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The ends of the `ruamel.yaml` range AD-26 bounds the parser-internals surface to, as
        # version specifiers rather than as series. The floor is pinned to the exact version
        # `pyproject.toml` declares, since a `0.18.*` leg would resolve to the newest 0.18
        # release and leave every earlier permitted one untested. The ceiling stays a series so
        # it tracks whatever the range currently admits. The lock only ever installs the
        # ceiling, so without this leg a difference at the floor would ship unseen.
        ruamel: ['0.18.0', '0.19.*']
    env:
      # The `tests` job owns the coverage gate; this leg only asks whether the suite still
      # passes against a different parser build.
      PYTEST_ADDOPTS: --no-cov
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --group dev
      # `ruamel.yaml.clib` is an optional accelerator no lock of this project installs, but any
      # other package in a user's environment may. It silently replaces the safe loader's pure
      # Python parser with a C one that reports different source marks and skips the resolver
      # and directive state the workflow audit inspects, so the suite runs with it present to
      # keep both of those boundaries independent of whether it is there.
      - run: uv pip install 'ruamel.yaml==${{ matrix.ruamel }}' ruamel.yaml.clib
      - run: uv run --no-sync pytest

  release:
    name: Release
    needs: [code-quality, tests, security-scan, yaml-compatibility]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      create_tag: ${{ steps.gate.outputs.create_tag }}
      version: ${{ steps.target.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --group dev

      - name: Determine target tag
        id: target
        run: uv run --no-sync python scripts/release_target.py

      - name: Tag-health gate
        id: gate
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          git fetch --tags --force
          uv run --no-sync python scripts/release_gate.py

      - name: Re-assert version sync
        if: steps.gate.outputs.proceed == 'true'
        run: uv run --no-sync python scripts/check_version_sync.py

      - name: Smoke-test the commit
        if: steps.gate.outputs.proceed == 'true'
        env:
          REF: git+https://github.com/Guardantix/doc-lattice@${{ github.sha }}
          FIXTURE: tests/fixtures/release-smoke/.doc-lattice.yml
        run: |
          uvx --python 3.13 --from "${REF}" doc-lattice check --config "${FIXTURE}"
          uvx --python 3.13 --from "${REF}" doc-lattice lint --config "${FIXTURE}"
          workdir="$(mktemp -d)"
          ( cd "${workdir}" && uvx --python 3.13 --from "${REF}" doc-lattice init )

      - name: Create and push the tag
        if: steps.gate.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "${TAG}"

      - name: Publish release notes
        if: steps.gate.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; leaving it unchanged."
          else
            uv run --no-sync python scripts/extract_release_notes.py "${VERSION}" > release-notes.md
            gh release create "${TAG}" --title "${TAG}" --notes-file release-notes.md --verify-tag
          fi

      - name: Confirm pinned ref resolves
        if: steps.gate.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          uvx --python 3.13 --from "git+https://github.com/Guardantix/doc-lattice@${TAG}" doc-lattice --version

  build-release:
    name: Build release distributions
    needs: release
    if: needs.release.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Build distributions
        run: uv build
      - name: Validate distributions
        run: uvx --from twine twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [release, build-release]
    if: needs.release.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          skip-existing: true
